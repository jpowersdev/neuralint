# Source: https://developers.home-assistant.io/docs/core/integration-quality-scale/rules/common-modules
{
  "version": 1,
  "id": "HA_IQS_COMMON_MODULES",
  "title": "Place common patterns in common modules",
  "description": "The Home Assistant codebase has a few common patterns that have originated over time.",
  "severity": "warning",
  "scope": {
    "include": [
      "homeassistant/components/**/*",
      "tests/components/**/*"
    ],
    "exclude": []
  },
  "instructions": "Evaluate the official Home Assistant Integration Quality Scale rule \"Place common patterns in common modules\". Official guidance: The Home Assistant codebase has a few common patterns that have originated over time. For example, the majority of new integrations use a coordinator to centralize their data fetching. The coordinator should be placed in coordinator.py. This increases consistency between integrations and makes it easier to find the coordinator for a specific integration. The second common pattern is the base entity. Since a lot of integrations provide more types of entities, a base entity can prove useful to reduce code duplication. The base entity should be placed in entity.py. The efforts done to increase consistency between integrations have a positive impact on the quality of the codebase and the developer experience.",
  "criteria": {
    "violation": "The change introduces or worsens a concrete failure to satisfy the integration requirement: Place common patterns in common modules.",
    "compliant": "The change preserves the requirement \"Place common patterns in common modules\", is unrelated to it, or the integration is explicitly covered by an official exception."
  },
  "thresholds": {
    "screenAt": 0.35,
    "violationAt": 0.8
  }
}
