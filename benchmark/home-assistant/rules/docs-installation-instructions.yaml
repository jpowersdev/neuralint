# Source: https://developers.home-assistant.io/docs/core/integration-quality-scale/rules/docs-installation-instructions
{
  "version": 1,
  "id": "HA_IQS_DOCS_INSTALLATION_INSTRUCTIONS",
  "title": "The documentation provides step-by-step installation instructions for the integration, including, if needed, prerequisites",
  "description": "We want users to have a smooth experience when setting up an integration.",
  "severity": "warning",
  "scope": {
    "include": [
      "homeassistant/components/**/*",
      "tests/components/**/*"
    ],
    "exclude": []
  },
  "instructions": "Evaluate the official Home Assistant Integration Quality Scale rule \"The documentation provides step-by-step installation instructions for the integration, including, if needed, prerequisites\". Official guidance: We want users to have a smooth experience when setting up an integration. This means that the documentation should provide clear and concise instructions on how to install the integration. This includes any prerequisites that are needed to install the integration.",
  "criteria": {
    "violation": "The change introduces or worsens a concrete failure to satisfy the integration requirement: The documentation provides step-by-step installation instructions for the integration, including, if needed, prerequisites.",
    "compliant": "The change preserves the requirement \"The documentation provides step-by-step installation instructions for the integration, including, if needed, prerequisites\", is unrelated to it, or the integration is explicitly covered by an official exception."
  },
  "thresholds": {
    "screenAt": 0.35,
    "violationAt": 0.8
  }
}
