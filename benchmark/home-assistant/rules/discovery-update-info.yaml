# Source: https://developers.home-assistant.io/docs/core/integration-quality-scale/rules/discovery-update-info
{
  "version": 1,
  "id": "HA_IQS_DISCOVERY_UPDATE_INFO",
  "title": "Integration uses discovery info to update network information",
  "description": "Most networks of end users are using dynamic IP addresses.",
  "severity": "warning",
  "scope": {
    "include": [
      "homeassistant/components/**/*",
      "tests/components/**/*"
    ],
    "exclude": []
  },
  "instructions": "Evaluate the official Home Assistant Integration Quality Scale rule \"Integration uses discovery info to update network information\". Official guidance: Most networks of end users are using dynamic IP addresses. This means that devices and services can get a different IP address than the one they had when they were first set up. To avoid the need for users to set devices to static IP addresses (which is not always possible), integrations should use the discovery information to update the network information of the device or service. We should only update the IP address of a device or service if the integration is sure that the device or service is the same one as set up previously. Exceptions: The exception to this rule is that not every device can be discovered. Integrations where the devices can't be discovered are exempt from this rule.",
  "criteria": {
    "violation": "The change introduces or worsens a concrete failure to satisfy the integration requirement: Integration uses discovery info to update network information.",
    "compliant": "The change preserves the requirement \"Integration uses discovery info to update network information\", is unrelated to it, or the integration is explicitly covered by an official exception."
  },
  "thresholds": {
    "screenAt": 0.35,
    "violationAt": 0.8
  }
}
