# Source: https://developers.home-assistant.io/docs/core/integration-quality-scale/rules/docs-troubleshooting
{
  "version": 1,
  "id": "HA_IQS_DOCS_TROUBLESHOOTING",
  "title": "The documentation provides troubleshooting information",
  "description": "We should provide instructions on how to fix a common issue.",
  "severity": "warning",
  "scope": {
    "include": [
      "homeassistant/components/**/*",
      "tests/components/**/*"
    ],
    "exclude": []
  },
  "instructions": "Evaluate the official Home Assistant Integration Quality Scale rule \"The documentation provides troubleshooting information\". Official guidance: We should provide instructions on how to fix a common issue. If possible, a troubleshooting topic should include a description of the symptom and the steps needed to fix the situation. This decreases the amount of support requests and improves the user experience.",
  "criteria": {
    "violation": "The change introduces or worsens a concrete failure to satisfy the integration requirement: The documentation provides troubleshooting information.",
    "compliant": "The change preserves the requirement \"The documentation provides troubleshooting information\", is unrelated to it, or the integration is explicitly covered by an official exception."
  },
  "thresholds": {
    "screenAt": 0.35,
    "violationAt": 0.8
  }
}
