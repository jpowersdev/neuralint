# Source: https://developers.home-assistant.io/docs/core/integration-quality-scale/rules/action-exceptions
{
  "version": 1,
  "id": "HA_IQS_ACTION_EXCEPTIONS",
  "title": "Service actions raise exceptions when encountering failures",
  "description": "Things can go wrong when a service action is performed.",
  "severity": "warning",
  "scope": {
    "include": [
      "homeassistant/components/**/*",
      "tests/components/**/*"
    ],
    "exclude": []
  },
  "instructions": "Evaluate the official Home Assistant Integration Quality Scale rule \"Service actions raise exceptions when encountering failures\". Official guidance: Things can go wrong when a service action is performed. When this happens, the integration should raise an exception to indicate that something went wrong. The exception message will be shown to the user in the UI, and can be used to help diagnose the issue. The message will either be generated from the attached translation string or from the exception argument.",
  "criteria": {
    "violation": "The change introduces or worsens a concrete failure to satisfy the integration requirement: Service actions raise exceptions when encountering failures.",
    "compliant": "The change preserves the requirement \"Service actions raise exceptions when encountering failures\", is unrelated to it, or the integration is explicitly covered by an official exception."
  },
  "thresholds": {
    "screenAt": 0.35,
    "violationAt": 0.8
  }
}
