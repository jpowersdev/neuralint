# Source: https://developers.home-assistant.io/docs/core/integration-quality-scale/rules/docs-known-limitations
{
  "version": 1,
  "id": "HA_IQS_DOCS_KNOWN_LIMITATIONS",
  "title": "The documentation describes known limitations of the integration (not to be confused with bugs)",
  "description": "Describing the known limitations of the integration in the documentation will allow users to know what to expect from the integration.",
  "severity": "warning",
  "scope": {
    "include": [
      "homeassistant/components/**/*",
      "tests/components/**/*"
    ],
    "exclude": []
  },
  "instructions": "Evaluate the official Home Assistant Integration Quality Scale rule \"The documentation describes known limitations of the integration (not to be confused with bugs)\". Official guidance: Describing the known limitations of the integration in the documentation will allow users to know what to expect from the integration. We should refrain from noting down bugs, since we use the issue tracker at GitHub for that and we don't want to duplicate information.",
  "criteria": {
    "violation": "The change introduces or worsens a concrete failure to satisfy the integration requirement: The documentation describes known limitations of the integration (not to be confused with bugs).",
    "compliant": "The change preserves the requirement \"The documentation describes known limitations of the integration (not to be confused with bugs)\", is unrelated to it, or the integration is explicitly covered by an official exception."
  },
  "thresholds": {
    "screenAt": 0.35,
    "violationAt": 0.8
  }
}
