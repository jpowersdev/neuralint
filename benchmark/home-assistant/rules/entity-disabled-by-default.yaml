# Source: https://developers.home-assistant.io/docs/core/integration-quality-scale/rules/entity-disabled-by-default
{
  "version": 1,
  "id": "HA_IQS_ENTITY_DISABLED_BY_DEFAULT",
  "title": "Integration disables less popular (or noisy) entities",
  "description": "Home Assistant keeps track of how the states of entities changes.",
  "severity": "warning",
  "scope": {
    "include": [
      "homeassistant/components/**/*",
      "tests/components/**/*"
    ],
    "exclude": []
  },
  "instructions": "Evaluate the official Home Assistant Integration Quality Scale rule \"Integration disables less popular (or noisy) entities\". Official guidance: Home Assistant keeps track of how the states of entities changes. This is done to be able to show the history of the entity in the UI. Every state that is tracked takes up a bit of resources. Entities that change state a lot (noisy entities), do this more often than entities that change state less often. We consider it a good practice to disable less popular or noisy entities by default. If users have a use case for such an entity, they can enable it. This way users that don't have a use case for the entity, don't have to pay the cost of tracking the state of the entity. There is no hard rule on what is considered a popular entity, since that depends on the integration and the device. So for example, a bluetooth temperature sensor can have an entity that represents the signal strength of the device. This entity is not very useful for most users, so it should be disabled by default. While if there was an integration providing a device to measure signal strength, that entity would be useful for most users and should be enabled by default.",
  "criteria": {
    "violation": "The change introduces or worsens a concrete failure to satisfy the integration requirement: Integration disables less popular (or noisy) entities.",
    "compliant": "The change preserves the requirement \"Integration disables less popular (or noisy) entities\", is unrelated to it, or the integration is explicitly covered by an official exception."
  },
  "thresholds": {
    "screenAt": 0.35,
    "violationAt": 0.8
  }
}
