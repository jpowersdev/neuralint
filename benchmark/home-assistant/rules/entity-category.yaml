# Source: https://developers.home-assistant.io/docs/core/integration-quality-scale/rules/entity-category
{
  "version": 1,
  "id": "HA_IQS_ENTITY_CATEGORY",
  "title": "Entities are assigned an appropriate EntityCategory",
  "description": "Entities should be assigned an appropriate EntityCategory to ensure that they are correctly classified and can be easily identified, when the default category is inappropriate.",
  "severity": "warning",
  "scope": {
    "include": [
      "homeassistant/components/**/*",
      "tests/components/**/*"
    ],
    "exclude": []
  },
  "instructions": "Evaluate the official Home Assistant Integration Quality Scale rule \"Entities are assigned an appropriate EntityCategory\". Official guidance: Entities should be assigned an appropriate EntityCategory to ensure that they are correctly classified and can be easily identified, when the default category is inappropriate. The entity category is used in, for example, auto-generated dashboards.",
  "criteria": {
    "violation": "The change introduces or worsens a concrete failure to satisfy the integration requirement: Entities are assigned an appropriate EntityCategory.",
    "compliant": "The change preserves the requirement \"Entities are assigned an appropriate EntityCategory\", is unrelated to it, or the integration is explicitly covered by an official exception."
  },
  "thresholds": {
    "screenAt": 0.35,
    "violationAt": 0.8
  }
}
