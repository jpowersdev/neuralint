# Source: https://developers.home-assistant.io/docs/core/integration-quality-scale/rules/strict-typing
{
  "version": 1,
  "id": "HA_IQS_STRICT_TYPING",
  "title": "Strict typing",
  "description": "Python is a dynamically typed language, which can be the source of many bugs.",
  "severity": "warning",
  "scope": {
    "include": [
      "homeassistant/components/**/*",
      "tests/components/**/*"
    ],
    "exclude": []
  },
  "instructions": "Evaluate the official Home Assistant Integration Quality Scale rule \"Strict typing\". Official guidance: Python is a dynamically typed language, which can be the source of many bugs. By using type hints, you can catch bugs early and avoid introducing them. Type hints are checked by mypy, a static type checker for Python. Because of the way typing in Python works, and type hints being optional in Python, mypy will only check the code that it knows to be type annotated. To improve on this, we recommend fully typing your library and making your library PEP-561 compliant. This means that you need to add a py.typed file to your library. This file tells mypy that your library is fully typed, after which it can read the type hints from your library. In the Home Assistant codebase, you can add your integration to the .strict-typing file, which will enable strict type checks for your integration.",
  "criteria": {
    "violation": "The change introduces or worsens a concrete failure to satisfy the integration requirement: Strict typing.",
    "compliant": "The change preserves the requirement \"Strict typing\", is unrelated to it, or the integration is explicitly covered by an official exception."
  },
  "thresholds": {
    "screenAt": 0.35,
    "violationAt": 0.8
  }
}
