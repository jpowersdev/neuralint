# Source: https://developers.home-assistant.io/docs/core/integration-quality-scale/rules/test-coverage
{
  "version": 1,
  "id": "HA_IQS_TEST_COVERAGE",
  "title": "Above 95% test coverage for all integration modules",
  "description": "Since we support a lot of different integrations, we don't have every device or service available for hands-on testing.",
  "severity": "warning",
  "scope": {
    "include": [
      "homeassistant/components/**/*",
      "tests/components/**/*"
    ],
    "exclude": []
  },
  "instructions": "Evaluate the official Home Assistant Integration Quality Scale rule \"Above 95% test coverage for all integration modules\". Official guidance: Since we support a lot of different integrations, we don't have every device or service available for hands-on testing. To make sure that we don't break anything, when accepting a code change, we need to have a good test coverage for all integration modules. This prevents the introduction of bugs and regressions. It also allows new developers to understand the codebase and make changes without breaking any existing use case.",
  "criteria": {
    "violation": "The change introduces or worsens a concrete failure to satisfy the integration requirement: Above 95% test coverage for all integration modules.",
    "compliant": "The change preserves the requirement \"Above 95% test coverage for all integration modules\", is unrelated to it, or the integration is explicitly covered by an official exception."
  },
  "thresholds": {
    "screenAt": 0.35,
    "violationAt": 0.8
  }
}
