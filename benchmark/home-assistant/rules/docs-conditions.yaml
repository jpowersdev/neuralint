# Source: https://developers.home-assistant.io/docs/core/integration-quality-scale/rules/docs-conditions
{
  "version": 1,
  "id": "HA_IQS_DOCS_CONDITIONS",
  "title": "The documentation describes the provided conditions that can be used",
  "description": "Integrations can register conditions to provide additional ways to trigger automations.",
  "severity": "warning",
  "scope": {
    "include": [
      "homeassistant/components/**/*",
      "tests/components/**/*"
    ],
    "exclude": []
  },
  "instructions": "Evaluate the official Home Assistant Integration Quality Scale rule \"The documentation describes the provided conditions that can be used\". Official guidance: Integrations can register conditions to provide additional ways to trigger automations. These conditions can be harder to use than the standard conditions, so we want to make sure that the documentation describes both what they do, and what the parameters are. To avoid cluttering the integration documentation, we want to have a separate page for each condition, and link to it from the integration documentation. Each condition page should have a description of what the condition does, a list of the parameters that can be used with it and an overview how to use the condition via the UI and via YAML.",
  "criteria": {
    "violation": "The change introduces or worsens a concrete failure to satisfy the integration requirement: The documentation describes the provided conditions that can be used.",
    "compliant": "The change preserves the requirement \"The documentation describes the provided conditions that can be used\", is unrelated to it, or the integration is explicitly covered by an official exception."
  },
  "thresholds": {
    "screenAt": 0.35,
    "violationAt": 0.8
  }
}
