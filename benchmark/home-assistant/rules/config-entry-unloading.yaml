# Source: https://developers.home-assistant.io/docs/core/integration-quality-scale/rules/config-entry-unloading
{
  "version": 1,
  "id": "HA_IQS_CONFIG_ENTRY_UNLOADING",
  "title": "Support config entry unloading",
  "description": "Integrations should support config entry unloading.",
  "severity": "warning",
  "scope": {
    "include": [
      "homeassistant/components/**/*",
      "tests/components/**/*"
    ],
    "exclude": []
  },
  "instructions": "Evaluate the official Home Assistant Integration Quality Scale rule \"Support config entry unloading\". Official guidance: Integrations should support config entry unloading. This allows Home Assistant to unload the integration on runtime, allowing the user to remove the integration or to reload it without having to restart Home Assistant. This improves the user experience, since the user can do more actions without having to restart Home Assistant.",
  "criteria": {
    "violation": "The change introduces or worsens a concrete failure to satisfy the integration requirement: Support config entry unloading.",
    "compliant": "The change preserves the requirement \"Support config entry unloading\", is unrelated to it, or the integration is explicitly covered by an official exception."
  },
  "thresholds": {
    "screenAt": 0.35,
    "violationAt": 0.8
  }
}
