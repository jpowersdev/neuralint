# Source: https://developers.home-assistant.io/docs/core/integration-quality-scale/rules/docs-use-cases
{
  "version": 1,
  "id": "HA_IQS_DOCS_USE_CASES",
  "title": "The documentation describes use cases to illustrate how this integration can be used",
  "description": "Sometimes, seeing a device or service integrated into Home Assistant can make you wonder, \"Why would I integrate this?\" For some integrations, the intended use and benefit are more obvious than for others.",
  "severity": "warning",
  "scope": {
    "include": [
      "homeassistant/components/**/*",
      "tests/components/**/*"
    ],
    "exclude": []
  },
  "instructions": "Evaluate the official Home Assistant Integration Quality Scale rule \"The documentation describes use cases to illustrate how this integration can be used\". Official guidance: Sometimes, seeing a device or service integrated into Home Assistant can make you wonder, \"Why would I integrate this?\" For some integrations, the intended use and benefit are more obvious than for others. Use case examples in the documentation can showcase the value of an integration.",
  "criteria": {
    "violation": "The change introduces or worsens a concrete failure to satisfy the integration requirement: The documentation describes use cases to illustrate how this integration can be used.",
    "compliant": "The change preserves the requirement \"The documentation describes use cases to illustrate how this integration can be used\", is unrelated to it, or the integration is explicitly covered by an official exception."
  },
  "thresholds": {
    "screenAt": 0.35,
    "violationAt": 0.8
  }
}
