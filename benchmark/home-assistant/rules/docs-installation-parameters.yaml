# Source: https://developers.home-assistant.io/docs/core/integration-quality-scale/rules/docs-installation-parameters
{
  "version": 1,
  "id": "HA_IQS_DOCS_INSTALLATION_PARAMETERS",
  "title": "The documentation describes all integration installation parameters",
  "description": "When setting up an integration, there's nothing more frustrating than not knowing what information is asked for.",
  "severity": "warning",
  "scope": {
    "include": [
      "homeassistant/components/**/*",
      "tests/components/**/*"
    ],
    "exclude": []
  },
  "instructions": "Evaluate the official Home Assistant Integration Quality Scale rule \"The documentation describes all integration installation parameters\". Official guidance: When setting up an integration, there's nothing more frustrating than not knowing what information is asked for. To improve the user experience, the documentation should describe all the parameters that are required during the installation process. This should help the user to gather all the necessary information before starting the installation process.",
  "criteria": {
    "violation": "The change introduces or worsens a concrete failure to satisfy the integration requirement: The documentation describes all integration installation parameters.",
    "compliant": "The change preserves the requirement \"The documentation describes all integration installation parameters\", is unrelated to it, or the integration is explicitly covered by an official exception."
  },
  "thresholds": {
    "screenAt": 0.35,
    "violationAt": 0.8
  }
}
