# Source: https://developers.home-assistant.io/docs/core/integration-quality-scale/rules/inject-websession
{
  "version": 1,
  "id": "HA_IQS_INJECT_WEBSESSION",
  "title": "The integration dependency supports passing in a websession",
  "description": "Since many devices and services are connected via HTTP, the number of active web sessions can be high.",
  "severity": "warning",
  "scope": {
    "include": [
      "homeassistant/components/**/*",
      "tests/components/**/*"
    ],
    "exclude": []
  },
  "instructions": "Evaluate the official Home Assistant Integration Quality Scale rule \"The integration dependency supports passing in a websession\". Official guidance: Since many devices and services are connected via HTTP, the number of active web sessions can be high. To improve the efficiency of those web sessions, it is recommended to support passing in a web session to the dependency client that is used by the integration. Home Assistants supports this for aiohttp and httpx. This means that the integration dependency should use either of those two libraries. Exceptions: If the integration is not making any HTTP requests, this rule does not apply.",
  "criteria": {
    "violation": "The change introduces or worsens a concrete failure to satisfy the integration requirement: The integration dependency supports passing in a websession.",
    "compliant": "The change preserves the requirement \"The integration dependency supports passing in a websession\", is unrelated to it, or the integration is explicitly covered by an official exception."
  },
  "thresholds": {
    "screenAt": 0.35,
    "violationAt": 0.8
  }
}
