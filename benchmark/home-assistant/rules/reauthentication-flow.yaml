# Source: https://developers.home-assistant.io/docs/core/integration-quality-scale/rules/reauthentication-flow
{
  "version": 1,
  "id": "HA_IQS_REAUTHENTICATION_FLOW",
  "title": "Reauthentication needs to be available via the UI",
  "description": "It can happen that users change their password of a device or service and forget that their device or account is still linked to Home Assistant.",
  "severity": "warning",
  "scope": {
    "include": [
      "homeassistant/components/**/*",
      "tests/components/**/*"
    ],
    "exclude": []
  },
  "instructions": "Evaluate the official Home Assistant Integration Quality Scale rule \"Reauthentication needs to be available via the UI\". Official guidance: It can happen that users change their password of a device or service and forget that their device or account is still linked to Home Assistant. To avoid that the user has to remove the configuration entry and re-add it, we start a reauthentication flow. During this flow, the user can provide the new credentials to use from now on. This is a very user-friendly way to let the user know that they need to take action and update their credentials. Exceptions: If the integration doesn't require any form of authentication, this rule doesn't apply.",
  "criteria": {
    "violation": "The change introduces or worsens a concrete failure to satisfy the integration requirement: Reauthentication needs to be available via the UI.",
    "compliant": "The change preserves the requirement \"Reauthentication needs to be available via the UI\", is unrelated to it, or the integration is explicitly covered by an official exception."
  },
  "thresholds": {
    "screenAt": 0.35,
    "violationAt": 0.8
  }
}
