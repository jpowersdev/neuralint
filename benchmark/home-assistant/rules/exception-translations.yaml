# Source: https://developers.home-assistant.io/docs/core/integration-quality-scale/rules/exception-translations
{
  "version": 1,
  "id": "HA_IQS_EXCEPTION_TRANSLATIONS",
  "title": "Exception messages are translatable",
  "description": "Sometimes something goes wrong and we want to show an error message to the user.",
  "severity": "warning",
  "scope": {
    "include": [
      "homeassistant/components/**/*",
      "tests/components/**/*"
    ],
    "exclude": []
  },
  "instructions": "Evaluate the official Home Assistant Integration Quality Scale rule \"Exception messages are translatable\". Official guidance: Sometimes something goes wrong and we want to show an error message to the user. Since Home Assistant is used by people all over the world, it is important that these error messages are translatable. This increases the usability of Home Assistant for people who do not use the application in English. Home Assistant has builtin support for translating messages coming from the HomeAssistantError exception.",
  "criteria": {
    "violation": "The change introduces or worsens a concrete failure to satisfy the integration requirement: Exception messages are translatable.",
    "compliant": "The change preserves the requirement \"Exception messages are translatable\", is unrelated to it, or the integration is explicitly covered by an official exception."
  },
  "thresholds": {
    "screenAt": 0.35,
    "violationAt": 0.8
  }
}
