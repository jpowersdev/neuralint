# Source: https://developers.home-assistant.io/docs/core/integration-quality-scale/rules/config-flow-test-coverage
{
  "version": 1,
  "id": "HA_IQS_CONFIG_FLOW_TEST_COVERAGE",
  "title": "Full test coverage for the config flow",
  "description": "The config flow is the first interaction a user has with your integration.",
  "severity": "warning",
  "scope": {
    "include": [
      "homeassistant/components/**/*",
      "tests/components/**/*"
    ],
    "exclude": []
  },
  "instructions": "Evaluate the official Home Assistant Integration Quality Scale rule \"Full test coverage for the config flow\". Official guidance: The config flow is the first interaction a user has with your integration. It is important to ensure that the config flow is working as expected and that the user can set up the integration without any issues or (config flow related) errors. This means that we want to have 100% test coverage for the config flow. In those tests, we require verification that the flow is able to recover from an error to confirm that the user is able to finish the flow even if something goes wrong. Since we want the user to have a smooth experience using other integration flows, this rule also applies to the reconfigure, reauthentication, and options flows. The extra added benefit of having tests for an integration is that it introduces the developer to testing, making it easier to write tests for other parts of the integration.",
  "criteria": {
    "violation": "The change introduces or worsens a concrete failure to satisfy the integration requirement: Full test coverage for the config flow.",
    "compliant": "The change preserves the requirement \"Full test coverage for the config flow\", is unrelated to it, or the integration is explicitly covered by an official exception."
  },
  "thresholds": {
    "screenAt": 0.35,
    "violationAt": 0.8
  }
}
