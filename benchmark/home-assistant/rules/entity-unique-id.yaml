# Source: https://developers.home-assistant.io/docs/core/integration-quality-scale/rules/entity-unique-id
{
  "version": 1,
  "id": "HA_IQS_ENTITY_UNIQUE_ID",
  "title": "Entities have a unique ID",
  "description": "In the past, entities weren't persisted.",
  "severity": "warning",
  "scope": {
    "include": [
      "homeassistant/components/**/*",
      "tests/components/**/*"
    ],
    "exclude": []
  },
  "instructions": "Evaluate the official Home Assistant Integration Quality Scale rule \"Entities have a unique ID\". Official guidance: In the past, entities weren't persisted. Home Assistant didn't track which entities it knew from the past and which it did not. To allow customizations to entities, like renaming the entity or changing the unit of measurement, Home Assistant needed a way to keep track of each individual entity across restarts. To solve this, Home Assistant introduced the entity registry. The entity registry is a central place where Home Assistant keeps track of all entities it knows about. Each entity in the entity registry has a unique ID, which is unique per integration domain and per platform domain. If an entity doesn't have a unique ID, the user has less control over the entity. Thus, making sure that entities have a unique ID improves the user experience.",
  "criteria": {
    "violation": "The change introduces or worsens a concrete failure to satisfy the integration requirement: Entities have a unique ID.",
    "compliant": "The change preserves the requirement \"Entities have a unique ID\", is unrelated to it, or the integration is explicitly covered by an official exception."
  },
  "thresholds": {
    "screenAt": 0.35,
    "violationAt": 0.8
  }
}
