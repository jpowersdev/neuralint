# Source: https://developers.home-assistant.io/docs/core/integration-quality-scale/rules/dependency-transparency
{
  "version": 1,
  "id": "HA_IQS_DEPENDENCY_TRANSPARENCY",
  "title": "Dependency transparency",
  "description": "Home Assistant uses a lot of dependencies to work.",
  "severity": "warning",
  "scope": {
    "include": [
      "homeassistant/components/**/*",
      "tests/components/**/*"
    ],
    "exclude": []
  },
  "instructions": "Evaluate the official Home Assistant Integration Quality Scale rule \"Dependency transparency\". Official guidance: Home Assistant uses a lot of dependencies to work. These dependencies will be shipped with new versions of Home Assistant. In order for the project to trust the dependencies, we have a set of requirements we want the dependencies to meet. - The source code of the dependency must be available under an OSI-approved license. - The dependency must be available on PyPI. - The package published to PyPI should be built in and published from a public CI pipeline. - The version of the dependency published on PyPI should correspond to a tagged release in an open online repository.",
  "criteria": {
    "violation": "The change introduces or worsens a concrete failure to satisfy the integration requirement: Dependency transparency.",
    "compliant": "The change preserves the requirement \"Dependency transparency\", is unrelated to it, or the integration is explicitly covered by an official exception."
  },
  "thresholds": {
    "screenAt": 0.35,
    "violationAt": 0.8
  }
}
