# Source: https://developers.home-assistant.io/docs/core/integration-quality-scale/rules/repair-issues
{
  "version": 1,
  "id": "HA_IQS_REPAIR_ISSUES",
  "title": "Repair issues and repair flows are used when user intervention is needed",
  "description": "Repair issues and repair flows are a very user-friendly manner to let the user know something is wrong and that they can do something about it.",
  "severity": "warning",
  "scope": {
    "include": [
      "homeassistant/components/**/*",
      "tests/components/**/*"
    ],
    "exclude": []
  },
  "instructions": "Evaluate the official Home Assistant Integration Quality Scale rule \"Repair issues and repair flows are used when user intervention is needed\". Official guidance: Repair issues and repair flows are a very user-friendly manner to let the user know something is wrong and that they can do something about it. Repair issues are just a way to let the user know that they can fix it themselves, while repair flows can fix it for them. Repair issues and repair flows should be actionable and informative about the problem. Thus, we should not raise repair issues for just letting users know that something is wrong, which they can't fix themselves.",
  "criteria": {
    "violation": "The change introduces or worsens a concrete failure to satisfy the integration requirement: Repair issues and repair flows are used when user intervention is needed.",
    "compliant": "The change preserves the requirement \"Repair issues and repair flows are used when user intervention is needed\", is unrelated to it, or the integration is explicitly covered by an official exception."
  },
  "thresholds": {
    "screenAt": 0.35,
    "violationAt": 0.8
  }
}
