# Source: https://developers.home-assistant.io/docs/core/integration-quality-scale/rules/entity-device-class
{
  "version": 1,
  "id": "HA_IQS_ENTITY_DEVICE_CLASS",
  "title": "Entities use device classes where possible",
  "description": "Device classes are a way to give context to an entity.",
  "severity": "warning",
  "scope": {
    "include": [
      "homeassistant/components/**/*",
      "tests/components/**/*"
    ],
    "exclude": []
  },
  "instructions": "Evaluate the official Home Assistant Integration Quality Scale rule \"Entities use device classes where possible\". Official guidance: Device classes are a way to give context to an entity. These are used by Home Assistant for various purposes like: - Allowing the user to switch to another unit of measurement than what the device provides. - They are used for voice control to ask questions like \"What is the temperature in the living room?\". - They are used for exposing entities to cloud based ecosystems like Google Assistant and Amazon Alexa. - They are used to adjust the representation in the Home Assistant UI. - They can be used to set a default name of the entity to decrease the burden on our translators. Because of these reasons, it is important to use device classes where possible.",
  "criteria": {
    "violation": "The change introduces or worsens a concrete failure to satisfy the integration requirement: Entities use device classes where possible.",
    "compliant": "The change preserves the requirement \"Entities use device classes where possible\", is unrelated to it, or the integration is explicitly covered by an official exception."
  },
  "thresholds": {
    "screenAt": 0.35,
    "violationAt": 0.8
  }
}
