# Source: https://developers.home-assistant.io/docs/core/integration-quality-scale/rules/integration-owner
{
  "version": 1,
  "id": "HA_IQS_INTEGRATION_OWNER",
  "title": "Has an integration owner",
  "description": "Home Assistant integrates with thousands of different devices and services, and most integrations are contributed by people other than the core maintainers of the project.",
  "severity": "warning",
  "scope": {
    "include": [
      "homeassistant/components/**/*",
      "tests/components/**/*"
    ],
    "exclude": []
  },
  "instructions": "Evaluate the official Home Assistant Integration Quality Scale rule \"Has an integration owner\". Official guidance: Home Assistant integrates with thousands of different devices and services, and most integrations are contributed by people other than the core maintainers of the project. The contributors that add and maintain an integration are encouraged to become the \"integration owner\". This is a role that grants the contributor more power when handling issues and pull requests for the integration in GitHub and it means that the contributor has taken on the responsibility for the stewardship of the integration. Integration owners will automatically get notified whenever there is a new issue or pull request for their integration. On GitHub the integration owner is referred to as the \"codeowner\". Integration owners are tracked in the manifest.json file of each integration. To become an integration owner, submit a pull request adding your GitHub username to the \"codeowners\" field in the manifest. An integration can have more than one owner. We love integration owners! We believe that integrations that have an owner are better maintained. During reviews, we see the integration owner as the subject matter expert on the integration, and weigh their opinion higher than others.",
  "criteria": {
    "violation": "The change introduces or worsens a concrete failure to satisfy the integration requirement: Has an integration owner.",
    "compliant": "The change preserves the requirement \"Has an integration owner\", is unrelated to it, or the integration is explicitly covered by an official exception."
  },
  "thresholds": {
    "screenAt": 0.35,
    "violationAt": 0.8
  }
}
