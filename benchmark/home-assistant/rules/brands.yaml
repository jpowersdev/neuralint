# Source: https://developers.home-assistant.io/docs/core/integration-quality-scale/rules/brands
{
  "version": 1,
  "id": "HA_IQS_BRANDS",
  "title": "Has branding assets available for the integration",
  "description": "Branding assets are important for the integration to be easily recognizable and to provide a consistent look and feel across all integrations.",
  "severity": "warning",
  "scope": {
    "include": [
      "homeassistant/components/**/*",
      "tests/components/**/*"
    ],
    "exclude": []
  },
  "instructions": "Evaluate the official Home Assistant Integration Quality Scale rule \"Has branding assets available for the integration\". Official guidance: Branding assets are important for the integration to be easily recognizable and to provide a consistent look and feel across all integrations. The project keeps track of them in the brands repository. The requirements on the needed assets can be found in the readme of the brands repository.",
  "criteria": {
    "violation": "The change introduces or worsens a concrete failure to satisfy the integration requirement: Has branding assets available for the integration.",
    "compliant": "The change preserves the requirement \"Has branding assets available for the integration\", is unrelated to it, or the integration is explicitly covered by an official exception."
  },
  "thresholds": {
    "screenAt": 0.35,
    "violationAt": 0.8
  }
}
