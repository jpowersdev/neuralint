# Source: https://developers.home-assistant.io/docs/core/integration-quality-scale/rules/docs-high-level-description
{
  "version": 1,
  "id": "HA_IQS_DOCS_HIGH_LEVEL_DESCRIPTION",
  "title": "The documentation includes a high-level description of the integration brand, product, or service",
  "description": "User documentation for an integration should provide a high-level description of the integration brand, product, or service.",
  "severity": "warning",
  "scope": {
    "include": [
      "homeassistant/components/**/*",
      "tests/components/**/*"
    ],
    "exclude": []
  },
  "instructions": "Evaluate the official Home Assistant Integration Quality Scale rule \"The documentation includes a high-level description of the integration brand, product, or service\". Official guidance: User documentation for an integration should provide a high-level description of the integration brand, product, or service. This information might help users decide whether an integration suits them and their use case. The documentation should also contain a link to the brand, product, or service website for further information, if possible. Exceptions: Integrations that do not integrate with a device or service, such as internal integrations, can't include a description of the device or service, and are exempt.",
  "criteria": {
    "violation": "The change introduces or worsens a concrete failure to satisfy the integration requirement: The documentation includes a high-level description of the integration brand, product, or service.",
    "compliant": "The change preserves the requirement \"The documentation includes a high-level description of the integration brand, product, or service\", is unrelated to it, or the integration is explicitly covered by an official exception."
  },
  "thresholds": {
    "screenAt": 0.35,
    "violationAt": 0.8
  }
}
