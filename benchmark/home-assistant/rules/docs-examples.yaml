# Source: https://developers.home-assistant.io/docs/core/integration-quality-scale/rules/docs-examples
{
  "version": 1,
  "id": "HA_IQS_DOCS_EXAMPLES",
  "title": "The documentation provides automation examples the user can use.",
  "description": "To show how the integration can be used, provide a limited set of blueprints, containing common or useful ones.",
  "severity": "warning",
  "scope": {
    "include": [
      "homeassistant/components/**/*",
      "tests/components/**/*"
    ],
    "exclude": []
  },
  "instructions": "Evaluate the official Home Assistant Integration Quality Scale rule \"The documentation provides automation examples the user can use.\". Official guidance: To show how the integration can be used, provide a limited set of blueprints, containing common or useful ones. This will help users to get started with the integration faster and easier. Upload the blueprints either to the blueprints folder under https://github.com/home-assistant/home-assistant.io/tree/current/source/blueprints/integrations, or to the blueprint exchange on the forums. On the integration page, add a link to the blueprint. Don't use the documentation pages as a collection or as a replacement of the blueprint folder or the blueprint exchange.",
  "criteria": {
    "violation": "The change introduces or worsens a concrete failure to satisfy the integration requirement: The documentation provides automation examples the user can use..",
    "compliant": "The change preserves the requirement \"The documentation provides automation examples the user can use.\", is unrelated to it, or the integration is explicitly covered by an official exception."
  },
  "thresholds": {
    "screenAt": 0.35,
    "violationAt": 0.8
  }
}
