# Source: https://developers.home-assistant.io/docs/core/integration-quality-scale/rules/dynamic-devices
{
  "version": 1,
  "id": "HA_IQS_DYNAMIC_DEVICES",
  "title": "Devices added after integration setup",
  "description": "Like explained in the rule stale-devices, devices should be removed automatically when we can be sure that the device is not connected anymore.",
  "severity": "warning",
  "scope": {
    "include": [
      "homeassistant/components/**/*",
      "tests/components/**/*"
    ],
    "exclude": []
  },
  "instructions": "Evaluate the official Home Assistant Integration Quality Scale rule \"Devices added after integration setup\". Official guidance: Like explained in the rule stale-devices, devices should be removed automatically when we can be sure that the device is not connected anymore. This rule explains the other side, once a new device is connected, we should automatically create the relevant entities for the device. This makes the user experience better, since the user only adds the device to the integration, and it will automatically show up in Home Assistant.",
  "criteria": {
    "violation": "The change introduces or worsens a concrete failure to satisfy the integration requirement: Devices added after integration setup.",
    "compliant": "The change preserves the requirement \"Devices added after integration setup\", is unrelated to it, or the integration is explicitly covered by an official exception."
  },
  "thresholds": {
    "screenAt": 0.35,
    "violationAt": 0.8
  }
}
