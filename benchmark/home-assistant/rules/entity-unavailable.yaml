# Source: https://developers.home-assistant.io/docs/core/integration-quality-scale/rules/entity-unavailable
{
  "version": 1,
  "id": "HA_IQS_ENTITY_UNAVAILABLE",
  "title": "Mark entity unavailable if appropriate",
  "description": "If we can't fetch data from a device or service, we should mark it as unavailable.",
  "severity": "warning",
  "scope": {
    "include": [
      "homeassistant/components/**/*",
      "tests/components/**/*"
    ],
    "exclude": []
  },
  "instructions": "Evaluate the official Home Assistant Integration Quality Scale rule \"Mark entity unavailable if appropriate\". Official guidance: If we can't fetch data from a device or service, we should mark it as unavailable. We do this to reflect a better state, than just showing the last known state. If we can successfully fetch data but are temporarily missing a few pieces of data, we should mark the entity state as unknown instead. Exceptions: If an integration can turn on a device, either via a user-defined automation trigger or by automatically creating a secondary control channel (for example, using Wake-on-LAN or infrared blaster), then the device should be reported as off when it is in standby and unresponsive to the main channel (for example, TCP). If no such method exists, and the device cannot be controlled in its current state, it should be reported as unavailable. An example scenario, for a media player that enters standby mode and can only be turned on using an external device (for example, an IR blaster): - When first added to Home Assistant, and there's no active connection, the device will be shown as unavailable. - If the user configures an automation (for example, using an IR blaster) to turn it on, the device will be shown as off while in standby. - Once turned on via the external method, and the main connection is established, the state will update to on.",
  "criteria": {
    "violation": "The change introduces or worsens a concrete failure to satisfy the integration requirement: Mark entity unavailable if appropriate.",
    "compliant": "The change preserves the requirement \"Mark entity unavailable if appropriate\", is unrelated to it, or the integration is explicitly covered by an official exception."
  },
  "thresholds": {
    "screenAt": 0.35,
    "violationAt": 0.8
  }
}
