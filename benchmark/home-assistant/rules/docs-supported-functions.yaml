# Source: https://developers.home-assistant.io/docs/core/integration-quality-scale/rules/docs-supported-functions
{
  "version": 1,
  "id": "HA_IQS_DOCS_SUPPORTED_FUNCTIONS",
  "title": "The documentation describes the supported functionality, including entities, and platforms",
  "description": "Users should be able to understand what value the integration will add for their (to be bought) device.",
  "severity": "warning",
  "scope": {
    "include": [
      "homeassistant/components/**/*",
      "tests/components/**/*"
    ],
    "exclude": []
  },
  "instructions": "Evaluate the official Home Assistant Integration Quality Scale rule \"The documentation describes the supported functionality, including entities, and platforms\". Official guidance: Users should be able to understand what value the integration will add for their (to be bought) device. This will help set users' expectations. For example, if a user is looking for a new fridge, we should try to be clear about what they can expect from the integration. If the integration only supports checking if the door is open or closed, they would be disappointed if they expected to be able to view the temperature of the fridge.",
  "criteria": {
    "violation": "The change introduces or worsens a concrete failure to satisfy the integration requirement: The documentation describes the supported functionality, including entities, and platforms.",
    "compliant": "The change preserves the requirement \"The documentation describes the supported functionality, including entities, and platforms\", is unrelated to it, or the integration is explicitly covered by an official exception."
  },
  "thresholds": {
    "screenAt": 0.35,
    "violationAt": 0.8
  }
}
