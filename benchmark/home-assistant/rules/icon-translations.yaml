# Source: https://developers.home-assistant.io/docs/core/integration-quality-scale/rules/icon-translations
{
  "version": 1,
  "id": "HA_IQS_ICON_TRANSLATIONS",
  "title": "Entities implement icon translations",
  "description": "In the past, icons were part of the state of the integration.",
  "severity": "warning",
  "scope": {
    "include": [
      "homeassistant/components/**/*",
      "tests/components/**/*"
    ],
    "exclude": []
  },
  "instructions": "Evaluate the official Home Assistant Integration Quality Scale rule \"Entities implement icon translations\". Official guidance: In the past, icons were part of the state of the integration. This was not really necessary, as they were usually either static or had a fixed set of states. To relieve the state machine, icon translations were introduced. The name of this feature sounds weird since it is not about translating the icon itself, but rather referencing an icon by a translation key. The idea behind icon translations is that the integration defines icons in a file, which is then used by the frontend to display the icon. This also adds support for different icons for state attribute values, for example the possible preset modes of a climate entity.",
  "criteria": {
    "violation": "The change introduces or worsens a concrete failure to satisfy the integration requirement: Entities implement icon translations.",
    "compliant": "The change preserves the requirement \"Entities implement icon translations\", is unrelated to it, or the integration is explicitly covered by an official exception."
  },
  "thresholds": {
    "screenAt": 0.35,
    "violationAt": 0.8
  }
}
