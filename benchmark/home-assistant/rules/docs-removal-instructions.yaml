# Source: https://developers.home-assistant.io/docs/core/integration-quality-scale/rules/docs-removal-instructions
{
  "version": 1,
  "id": "HA_IQS_DOCS_REMOVAL_INSTRUCTIONS",
  "title": "The documentation provides removal instructions",
  "description": "Removing a device or service from Home Assistant isn't always straightforward.",
  "severity": "warning",
  "scope": {
    "include": [
      "homeassistant/components/**/*",
      "tests/components/**/*"
    ],
    "exclude": []
  },
  "instructions": "Evaluate the official Home Assistant Integration Quality Scale rule \"The documentation provides removal instructions\". Official guidance: Removing a device or service from Home Assistant isn't always straightforward. The documentation should provide clear instructions on how to remove the device or service.",
  "criteria": {
    "violation": "The change introduces or worsens a concrete failure to satisfy the integration requirement: The documentation provides removal instructions.",
    "compliant": "The change preserves the requirement \"The documentation provides removal instructions\", is unrelated to it, or the integration is explicitly covered by an official exception."
  },
  "thresholds": {
    "screenAt": 0.35,
    "violationAt": 0.8
  }
}
