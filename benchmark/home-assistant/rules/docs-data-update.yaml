# Source: https://developers.home-assistant.io/docs/core/integration-quality-scale/rules/docs-data-update
{
  "version": 1,
  "id": "HA_IQS_DOCS_DATA_UPDATE",
  "title": "The documentation describes how data is updated",
  "description": "For the user to know how the integration works, we should describe how the data of the integration is updated.",
  "severity": "warning",
  "scope": {
    "include": [
      "homeassistant/components/**/*",
      "tests/components/**/*"
    ],
    "exclude": []
  },
  "instructions": "Evaluate the official Home Assistant Integration Quality Scale rule \"The documentation describes how data is updated\". Official guidance: For the user to know how the integration works, we should describe how the data of the integration is updated. Because this will help users create an expectation on how well the integration works for their use case. A motion sensor that only polls every 5 minutes is less usable than a motion sensor that actively pushes updates. Since users can define their own polling interval for polling integrations, we should add at what rate we poll now and describe any limitations. For example if the device we connect to has known problems handling too many requests, we should describe that in the documentation.",
  "criteria": {
    "violation": "The change introduces or worsens a concrete failure to satisfy the integration requirement: The documentation describes how data is updated.",
    "compliant": "The change preserves the requirement \"The documentation describes how data is updated\", is unrelated to it, or the integration is explicitly covered by an official exception."
  },
  "thresholds": {
    "screenAt": 0.35,
    "violationAt": 0.8
  }
}
