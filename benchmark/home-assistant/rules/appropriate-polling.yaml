# Source: https://developers.home-assistant.io/docs/core/integration-quality-scale/rules/appropriate-polling
{
  "version": 1,
  "id": "HA_IQS_APPROPRIATE_POLLING",
  "title": "If it's a polling integration, set an appropriate polling interval",
  "description": "In an ideal world, all integrations would have a push-based data interface, where the device or service would let us know when new data is available.",
  "severity": "warning",
  "scope": {
    "include": [
      "homeassistant/components/**/*",
      "tests/components/**/*"
    ],
    "exclude": []
  },
  "instructions": "Evaluate the official Home Assistant Integration Quality Scale rule \"If it's a polling integration, set an appropriate polling interval\". Official guidance: In an ideal world, all integrations would have a push-based data interface, where the device or service would let us know when new data is available. This would decrease the amount of requests Home Assistant would make. However, in the real world, many devices and services are not capable of push-based communication, so we have to resort to polling. To do this responsibly, we should set an appropriate polling interval that will serve the majority of users. There is no real definition of what an appropriate polling interval is, as it depends on the device or service being polled. For example, we should not poll an air quality sensor every 5 seconds, as the data will not change that often. In those cases, more than 99% of the users will be fine with a polling interval of a minute or more. To give another example, if we poll a cloud service for solar panel data where the data is updated every hour. It would not make sense for us to poll every minute, as the data will not change between the polls. For the users that do want to have more frequent updates, they can define a custom polling interval",
  "criteria": {
    "violation": "The change introduces or worsens a concrete failure to satisfy the integration requirement: If it's a polling integration, set an appropriate polling interval.",
    "compliant": "The change preserves the requirement \"If it's a polling integration, set an appropriate polling interval\", is unrelated to it, or the integration is explicitly covered by an official exception."
  },
  "thresholds": {
    "screenAt": 0.35,
    "violationAt": 0.8
  }
}
