# Source: https://developers.home-assistant.io/docs/core/integration-quality-scale/rules/parallel-updates
{
  "version": 1,
  "id": "HA_IQS_PARALLEL_UPDATES",
  "title": "Number of parallel updates is specified",
  "description": "Some devices or services don't like receiving a lot of requests at the same time.",
  "severity": "warning",
  "scope": {
    "include": [
      "homeassistant/components/**/*",
      "tests/components/**/*"
    ],
    "exclude": []
  },
  "instructions": "Evaluate the official Home Assistant Integration Quality Scale rule \"Number of parallel updates is specified\". Official guidance: Some devices or services don't like receiving a lot of requests at the same time. To avoid that, Home Assistant has a built-in feature to limit the number of requests that are sent to a device or service at the same time. This will be applied to both entity updates and actions calls. We consider it a good practice to explicitly set the number of parallel updates.",
  "criteria": {
    "violation": "The change introduces or worsens a concrete failure to satisfy the integration requirement: Number of parallel updates is specified.",
    "compliant": "The change preserves the requirement \"Number of parallel updates is specified\", is unrelated to it, or the integration is explicitly covered by an official exception."
  },
  "thresholds": {
    "screenAt": 0.35,
    "violationAt": 0.8
  }
}
