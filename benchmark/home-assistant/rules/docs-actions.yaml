# Source: https://developers.home-assistant.io/docs/core/integration-quality-scale/rules/docs-actions
{
  "version": 1,
  "id": "HA_IQS_DOCS_ACTIONS",
  "title": "The documentation describes the provided service actions that can be used",
  "description": "Integrations can register service actions to provide functionality that is not possible with standard entities.",
  "severity": "warning",
  "scope": {
    "include": [
      "homeassistant/components/**/*",
      "tests/components/**/*"
    ],
    "exclude": []
  },
  "instructions": "Evaluate the official Home Assistant Integration Quality Scale rule \"The documentation describes the provided service actions that can be used\". Official guidance: Integrations can register service actions to provide functionality that is not possible with standard entities. These service actions can be harder to use than the standard service actions, so we want to make sure that the documentation describes both what they do, and what the parameters are.",
  "criteria": {
    "violation": "The change introduces or worsens a concrete failure to satisfy the integration requirement: The documentation describes the provided service actions that can be used.",
    "compliant": "The change preserves the requirement \"The documentation describes the provided service actions that can be used\", is unrelated to it, or the integration is explicitly covered by an official exception."
  },
  "thresholds": {
    "screenAt": 0.35,
    "violationAt": 0.8
  }
}
