# Source: https://developers.home-assistant.io/docs/core/integration-quality-scale/rules/docs-configuration-parameters
{
  "version": 1,
  "id": "HA_IQS_DOCS_CONFIGURATION_PARAMETERS",
  "title": "The documentation describes all integration configuration options",
  "description": "Integrations can provide an options flow to allow users to change integration configuration.",
  "severity": "warning",
  "scope": {
    "include": [
      "homeassistant/components/**/*",
      "tests/components/**/*"
    ],
    "exclude": []
  },
  "instructions": "Evaluate the official Home Assistant Integration Quality Scale rule \"The documentation describes all integration configuration options\". Official guidance: Integrations can provide an options flow to allow users to change integration configuration. This rule ensures that all configuration options are documented so that users can understand what each option does and how to use it.",
  "criteria": {
    "violation": "The change introduces or worsens a concrete failure to satisfy the integration requirement: The documentation describes all integration configuration options.",
    "compliant": "The change preserves the requirement \"The documentation describes all integration configuration options\", is unrelated to it, or the integration is explicitly covered by an official exception."
  },
  "thresholds": {
    "screenAt": 0.35,
    "violationAt": 0.8
  }
}
