# Source: https://developers.home-assistant.io/docs/core/integration-quality-scale/rules/async-dependency
{
  "version": 1,
  "id": "HA_IQS_ASYNC_DEPENDENCY",
  "title": "Dependency is async",
  "description": "Home Assistant works with asyncio to be efficient when handling tasks.",
  "severity": "warning",
  "scope": {
    "include": [
      "homeassistant/components/**/*",
      "tests/components/**/*"
    ],
    "exclude": []
  },
  "instructions": "Evaluate the official Home Assistant Integration Quality Scale rule \"Dependency is async\". Official guidance: Home Assistant works with asyncio to be efficient when handling tasks. To avoid switching context between the asyncio event loop and other threads, which is costly performance wise, ideally, your library should also use asyncio. This results not only in a more efficient system but the code is also more neat.",
  "criteria": {
    "violation": "The change introduces or worsens a concrete failure to satisfy the integration requirement: Dependency is async.",
    "compliant": "The change preserves the requirement \"Dependency is async\", is unrelated to it, or the integration is explicitly covered by an official exception."
  },
  "thresholds": {
    "screenAt": 0.35,
    "violationAt": 0.8
  }
}
