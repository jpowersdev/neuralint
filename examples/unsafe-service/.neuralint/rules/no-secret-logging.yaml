version: 1
id: SECURITY002
title: Do not log authentication secrets
description: Passwords, access tokens, and complete credential objects must never be written to logs.
severity: critical
scope:
  include: ["src/auth.ts"]
  exclude: []
instructions: >-
  Detect changed code that sends passwords, tokens, API keys, authorization headers,
  or objects containing these values to a logging API. Logging non-sensitive identifiers
  and redacted values is compliant.
criteria:
  violation: The change logs a secret or an object known to contain a secret.
  compliant: The change does not log authentication secrets, or explicitly redacts them first.
thresholds:
  screenAt: 0.35
  violationAt: 0.8
